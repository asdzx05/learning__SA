openapi: 3.0.3
info:
  title: Medusa Store API — Products & Carts (реконструкция)
  description:  Сфокусированная OpenAPI-спецификация 5 ключевых эндпоинтов
  version: 2.0.0
  contact:
    name: Medusa Store API
    url: https://docs.medusajs.com/api/store

servers:
  - url: https://api.medusajs.com
    description: Production
  - url: http://localhost:9000
    description: Local development

security:
  - PublishableApiKey: []

tags:
  - name: Products
    description: Каталог товаров
  - name: Carts
    description: Корзина покупок

paths:
  /store/products:
    get:
      summary: List products
      operationId: listProducts
      tags:
        - Products
      parameters:
        - name: q
          in: query
          required: false
          description: 'Поисковая строка'
          schema:
            type: string
        - name: id
          in: query
          required: false
          description: 'Фильтр по одному или нескольким id'
          schema:
            type: string
        - name: handle
          in: query
          required: false
          schema:
            type: string
        - name: collection_id
          in: query
          required: false
          description: 'Фильтр по коллекциям'
          schema:
            type: array
            items:
              type: string
        - name: category_id
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: region_id
          in: query
          required: false
          description: 'Регион — влияет на расчёт цен (calculated_price)'
          schema:
            type: string
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
        - name: fields
          in: query
          required: false
          description: 'Выбор полей и связей (comma-separated)'
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: 'Сортировка, префикс - для убывания'
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              example:
                products:
                  - id: 'prod_01H...'
                    title: 'Medusa T-Shirt'
                    subtitle: null
                    description: 'Comfortable cotton t-shirt'
                    handle: 'medusa-t-shirt'
                    is_giftcard: false
                    status: 'published'
                    thumbnail: 'https://cdn.medusa.io/t-shirt.png'
                    collection_id: 'pcol_01H...'
                    options: []
                    variants:
                      - id: 'variant_01H...'
                        title: 'S / Black'
                        sku: 'SHIRT-S-BLACK'
                        inventory_quantity: 100
                        manage_inventory: true
                        allow_backorder: false
                        calculated_price:
                          calculated_amount: 2500
                          currency_code: 'eur'
                    created_at: '2026-01-10T10:00:00.000Z'
                    updated_at: '2026-01-10T10:00:00.000Z'
                count: 142
                offset: 0
                limit: 10
        '400':
          $ref: '#/components/responses/BadRequest'

  /store/products/{id}:
    get:
      summary: Get a product
      operationId: getProduct
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'prod_01H...'
        - name: region_id
          in: query
          required: false
          description: 'Регион для расчёта цен'
          schema:
            type: string
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
        - name: fields
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Данные товара
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              example:
                product:
                  id: 'prod_01H...'
                  title: 'Medusa T-Shirt'
                  description: 'Comfortable cotton t-shirt'
                  handle: 'medusa-t-shirt'
                  is_giftcard: false
                  status: 'published'
                  thumbnail: 'https://cdn.medusa.io/t-shirt.png'
                  options: []
                  variants:
                    - id: 'variant_01H...'
                      title: 'S / Black'
                      sku: 'SHIRT-S-BLACK'
                      inventory_quantity: 100
                      calculated_price:
                        calculated_amount: 2500
                        currency_code: 'eur'
                  created_at: '2026-01-10T10:00:00.000Z'
                  updated_at: '2026-01-10T10:00:00.000Z'
        '404':
          $ref: '#/components/responses/NotFound'

  /store/carts:
    post:
      summary: Create a cart
      operationId: createCart
      tags:
        - Carts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCreate'
            example:
              region_id: 'reg_01H...'
              email: 'customer@example.com'
              currency_code: 'eur'
              items:
                - variant_id: 'variant_01H...'
                  quantity: 2
      responses:
        '200':
          description: Корзина создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                cart:
                  id: 'cart_01H...'
                  region_id: 'reg_01H...'
                  email: 'customer@example.com'
                  currency_code: 'eur'
                  items:
                    - id: 'item_01H...'
                      title: 'Medusa T-Shirt'
                      variant_id: 'variant_01H...'
                      quantity: 2
                      unit_price: 2500
                  item_total: 5000
                  total: 5000
                  created_at: '2026-01-10T10:00:00.000Z'
                  updated_at: '2026-01-10T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'

  /store/carts/{id}:
    get:
      summary: Get a cart
      operationId: getCart
      tags:
        - Carts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'cart_01H...'
        - name: fields
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Данные корзины
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                cart:
                  id: 'cart_01H...'
                  region_id: 'reg_01H...'
                  email: 'customer@example.com'
                  currency_code: 'eur'
                  items:
                    - id: 'item_01H...'
                      title: 'Medusa T-Shirt'
                      variant_id: 'variant_01H...'
                      quantity: 2
                      unit_price: 2500
                  item_total: 5000
                  total: 5000
                  created_at: '2026-01-10T10:00:00.000Z'
                  updated_at: '2026-01-10T10:00:00.000Z'
        '404':
          $ref: '#/components/responses/NotFound'

  /store/carts/{id}/line-items:
    post:
      summary: Add a line item to cart
      operationId: addLineItem
      tags:
        - Carts
      parameters:
        - name: id
          in: path
          required: true
          description: 'ID корзины'
          schema:
            type: string
          example: 'cart_01H...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineItemCreate'
            example:
              variant_id: 'variant_01H...'
              quantity: 1
      responses:
        '200':
          description: Товар добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                cart:
                  id: 'cart_01H...'
                  region_id: 'reg_01H...'
                  currency_code: 'eur'
                  items:
                    - id: 'item_01H...'
                      title: 'Medusa T-Shirt'
                      variant_id: 'variant_01H...'
                      quantity: 2
                      unit_price: 2500
                    - id: 'item_02H...'
                      title: 'Medusa Mug'
                      variant_id: 'variant_02H...'
                      quantity: 1
                      unit_price: 1000
                  item_total: 6000
                  total: 6000
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Product:
      type: object
      description: 'Товар. Ключевые поля из StoreProduct.'
      properties:
        id:
          type: string
          example: 'prod_01H...'
        title:
          type: string
          example: 'Medusa T-Shirt'
        subtitle:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        handle:
          type: string
          description: 'URL-slug товара'
          example: 'medusa-t-shirt'
        is_giftcard:
          type: boolean
          example: false
        status:
          type: string
          enum: [draft, proposed, published, rejected]
          example: published
        thumbnail:
          type: string
          nullable: true
        collection_id:
          type: string
          nullable: true
        options:
          type: array
          items:
            type: object
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductVariant:
      type: object
      description: 'Вариант товара (размер/цвет). Ключевые поля из StoreProductVariant.'
      properties:
        id:
          type: string
          example: 'variant_01H...'
        title:
          type: string
          example: 'S / Black'
        sku:
          type: string
          nullable: true
          example: 'SHIRT-S-BLACK'
        product_id:
          type: string
        inventory_quantity:
          type: number
          example: 100
        manage_inventory:
          type: boolean
        allow_backorder:
          type: boolean
        calculated_price:
          type: object
          nullable: true
          description: 'Цена, рассчитанная под region_id/currency_code запроса'
          properties:
            calculated_amount:
              type: number
              example: 2500
            currency_code:
              type: string
              example: 'eur'

    Cart:
      type: object
      description: 'Корзина. Ключевые поля из StoreCart.'
      properties:
        id:
          type: string
          example: 'cart_01H...'
        region_id:
          type: string
        customer_id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        currency_code:
          type: string
          example: 'eur'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        item_total:
          type: number
          example: 5000
        total:
          type: number
          example: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LineItem:
      type: object
      description: 'Позиция в корзине. Ключевые поля из StoreCartLineItem.'
      properties:
        id:
          type: string
          example: 'item_01H...'
        title:
          type: string
        thumbnail:
          type: string
          nullable: true
        quantity:
          type: number
          example: 2
        product_id:
          type: string
        variant_id:
          type: string
        unit_price:
          type: number
          example: 2500

    CartCreate:
      type: object
      description: 'Тело создания корзины. Все поля опциональны.'
      properties:
        region_id:
          type: string
          description: 'Регион (определяет валюту и налоги)'
        email:
          type: string
        currency_code:
          type: string
        sales_channel_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItemCreate'

    LineItemCreate:
      type: object
      required:
        - variant_id
        - quantity
      properties:
        variant_id:
          type: string
          example: 'variant_01H...'
        quantity:
          type: integer
          minimum: 1
          example: 1
        metadata:
          type: object
          nullable: true

    ProductListResponse:
      type: object
      description: 'Конверт списка Medusa: массив + count/offset/limit'
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        count:
          type: integer
          example: 142
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 10

    ProductResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'

    CartResponse:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/Cart'

    Error:
      type: object
      description: 'Формат ошибки Medusa'
      properties:
        code:
          type: string
          example: 'not_found'
        type:
          type: string
          example: 'not_found'
        message:
          type: string
          example: 'Product with id prod_x was not found'

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 'invalid_data'
            type: 'invalid_data'
            message: 'quantity must be a positive integer'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 'not_found'
            type: 'not_found'
            message: 'Cart with id cart_x was not found'

  securitySchemes:
    PublishableApiKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: 'Публикуемый ключ канала продаж (обязателен для всех /store роутов)'
