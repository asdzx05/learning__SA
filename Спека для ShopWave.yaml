openapi: 3.0.3
info:
  title: Order Service API
  description: REST API for orders
  version: 1.0.0
  contact:
    name: API Support
    email: api@example.com

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://staging.api.example.com/v1
    description: Staging

paths:
  # List all orders
  /orders:
    get:
      summary: List all orders
      operationId: listOrders
      tags:
        - Orders
      parameters:
        - name: limit
          in: query
          description: Number of items to return
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [CREATED, PAID, ASSEMBLY, SHIPPED, DELIVERED, CANCELLED]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: customerId
          in: query
          schema:
            type: integer

      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'


    post:
      summary: Create new order
      operationId: createOrder
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'


  /orders/{id}:
    get:
      summary: Get order by ID
      operationId: getOrder
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update order
      operationId: updateOrder
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableOrder'



components:
  schemas:
    OrderItem:
      type: object
      required:
        - productId
        - name
        - quantity
        - price
      properties:
        productId:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number
    Order:
      type: object
      required:
        - id
        - customerId
        - items
        - status
        - totalAmount
        - shippingAddress
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 12345
        customerId:
          type: integer
          example: 777
        items:
          type: array
          items:
              $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [CREATED, PAID, ASSEMBLY, SHIPPED, DELIVERED, CANCELLED]
          example: PAID
        totalAmount:
          type: number
          example: 89990.50
        shippingAddress:
          type: string
          example: "Новосибирск, ул. Ленина, 1"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreate:
      type: object
      required:
        - customerId
        - items
        - shippingAddress
      properties:
        customerId:
          type: integer
        items:
          type: array
          items:
              $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          type: string

    OrderStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [CREATED, PAID, ASSEMBLY, SHIPPED, DELIVERED, CANCELLED]

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string


  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflict (duplicate, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    UnprocessableOrder:
      description: Request is valid but violates a business rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
